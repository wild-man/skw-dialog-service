[package]
name = "skw-dialog-service"
version = { workspace = true }
edition = { workspace = true }
authors = ["Sergey Kutsenko <sergey.wild.man@gmail.com>"]

# shared by both binaries: db models, llm client, queue config
[lib]
path = "src/lib.rs"

# Iggy consumer: dialog methods (signed topic)
[[bin]]
name = "dialog-stream-service"
path = "src/stream.rs"

# RabbitMQ worker: asks the LLM for Pending answers
[[bin]]
name = "dialog-mq-service"
path = "src/mq.rs"

[[bin]]
name = "dialog-migrate"
path = "src/migrate.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_derive = { workspace = true }
skw-lib-shared = { workspace = true }
skw-lib-http-protos = { workspace = true }
skw-lib-task-protos = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
